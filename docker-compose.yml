services:
  pgsql:
    image: ghcr.io/baosystems/postgis:17-3.5
    container_name: 8truck-pgsql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: eight_truck
      POSTGRES_USER: eight_truck
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./docker/pgsql/create-test-db.sql:/docker-entrypoint-initdb.d/20-create-test-db.sql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'eight_truck', '-d', 'eight_truck']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: 8truck-redis
    ports:
      - '6390:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  horizon:
    build: ./docker/php
    container_name: 8truck-horizon
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    env_file: .env
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_HOST: reverb
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    build: ./docker/php
    container_name: 8truck-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www/html
    env_file: .env
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '8080:8080'
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgsql-data:
  redis-data:
